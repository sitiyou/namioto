[project]
name = "namioto"
version = "0.1.0"
description = "A WaveTone-style MIDI editor with spectrum assisted transcription"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "sitiyou" }]
dependencies = [
    "lark>=1.3.1",
    "librosa>=1.0",
    "mido>=1.3.3",
    "platformdirs>=4.11.8",
    "pyqt6>=6.11.0",
    "python-rtmidi>=1.5.8",
    "qtawesome>=1.4.2",
    "scipy>=1.11",
]

# the runtime the analysis jobs open a model with; the builds are mutually exclusive, since they all
# provide the same `onnxruntime` module, so a machine installs exactly one of them. `rocm` is
# Microsoft's `onnxruntime-migraphx`: AMD's own `onnxruntime-rocm` carries ROCMExecutionProvider,
# while the GPU device the program offers runs on MIGraphXExecutionProvider
[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
cuda = ["onnxruntime-gpu>=1.20"]
rocm = ["onnxruntime-migraphx>=1.20"]

[project.scripts]
namioto = "namioto.ui.app:main"
namioto-tempo = "namioto.analysis.beats:main"
namioto-wavetone = "namioto.analysis.wavetone:main"
namioto-spectrum = "namioto.analysis.spectrum:main"
namioto-tempocnn = "namioto.analysis.tempo:main"
namioto-game = "namioto.analysis.game:main"
namioto-align = "namioto.analysis.align:main"

[dependency-groups]
# the analysis jobs need one of the onnxruntime builds and the tests exercise them, but no default
# group may carry one: `uv sync` always includes it, so `--extra cuda`/`rocm` would install a second
# build over it. Development picks its build with `--extra cpu` (or `--extra cuda`/`--extra rocm`)
dev = ["pytest>=8"]
# torch/torchaudio/transformers/onnx are only for scripts/export_align_model.py; the program runs
# the converted ONNX graph through onnxruntime and never imports them
export = ["torch", "torchaudio", "transformers", "onnx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namioto"]

[tool.hatch.build.targets.sdist]
include = ["namioto", "scripts", "build.sh", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.uv]
# installing two of the onnxruntime builds would overwrite each other's `onnxruntime` module; uv is
# told they conflict so it refuses the pair instead of producing a broken environment (pip cannot)
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the beat tracker's own tests run the real estimator over 60-90 s of audio, which is most of the
# suite's time; they are there for -m slow, and for a full run pass -m ''
markers = ["slow: measures the beat tracker over minutes of audio"]
addopts = "-m 'not slow'"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["namioto", "tests", "scripts"]
exclude = ["refs", "build", "dist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
