[project]
name = "namioto"
version = "0.1.0"
description = "A WaveTone-style MIDI editor with spectrum assisted transcription"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "namioto/models/LICENSE-CC-BY-NC-SA-4.0.txt"]
authors = [{ name = "sitiyou" }]
dependencies = [
    "librosa>=1.0",
    "onnxruntime>=1.20",
    "pyqt6>=6.11.0",
    "scipy>=1.11",
]

[project.scripts]
namioto = "namioto.ui.app:main"
namioto-tempo = "namioto.tempo:main"
namioto-spectrum = "namioto.spectrum:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namioto"]

[tool.hatch.build.targets.sdist]
include = ["namioto", "scripts", "build.sh", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
