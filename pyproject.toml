[project]
name = "namioto"
version = "0.1.0"
description = "A WaveTone-style MIDI editor with spectrum assisted transcription"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "namioto/models/LICENSE-CC-BY-NC-SA-4.0.txt"]
authors = [{ name = "sitiyou" }]
dependencies = [
    "lark>=1.3.1",
    "librosa>=1.0",
    "mido>=1.3.3",
    "onnxruntime>=1.20",
    "platformdirs>=4.11.8",
    "pyqt6>=6.11.0",
    "python-rtmidi>=1.5.8",
    "qtawesome>=1.4.2",
    "scipy>=1.11",
]

[project.scripts]
namioto = "namioto.ui.app:main"
namioto-tempo = "namioto.beats:main"
namioto-wavetone = "namioto.wavetone:main"
namioto-spectrum = "namioto.spectrum:main"
namioto-tempocnn = "namioto.tempo:main"
namioto-game = "namioto.game:main"
namioto-align = "namioto.align:main"

[dependency-groups]
dev = ["pytest>=8"]
# torch/torchaudio/transformers/onnx are only for scripts/export_align_model.py; the program runs
# the converted ONNX graph through onnxruntime and never imports them
export = ["torch", "torchaudio", "transformers", "onnx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["namioto"]

[tool.hatch.build.targets.sdist]
include = ["namioto", "scripts", "build.sh", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["namioto", "tests", "scripts"]
exclude = ["refs", "build", "dist"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
