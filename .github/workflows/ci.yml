name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - run: uv sync --locked --extra cpu
      - run: uvx ruff check namioto tests scripts/package_release.py
      - run: uv run --no-sync pytest

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 desktop-file-utils
      - name: Build frozen application
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash puts its coreutils `link.exe` ahead of MSVC's linker, which meson refuses
            msvc="$(cygpath -u "$VCToolsInstallDir")"
            export PATH="${msvc%/}/bin/Hostx64/x64:$PATH"
          fi
          bash build.sh app
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.9.1 --repo AppImage/appimagetool --pattern appimagetool-x86_64.AppImage --dir build
          chmod +x build/appimagetool-x86_64.AppImage
          python scripts/package_release.py appimage --appimagetool build/appimagetool-x86_64.AppImage
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: namioto-Linux-x86_64
          path: dist/release/namioto-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: namioto-Windows-x86_64
          path: dist/namioto
          if-no-files-found: error
          retention-days: 14

  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, build: cp314-manylinux_x86_64}
          - {os: windows-2022, build: cp314-win_amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - name: Build and test wheel
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair --plat manylinux_2_34_x86_64 --only-plat -w {dest_dir} {wheel}
          CIBW_CONFIG_SETTINGS_WINDOWS: setup-args=--vsenv
          CIBW_TEST_EXTRAS: cpu
          CIBW_TEST_ENVIRONMENT: 'PIP_ONLY_BINARY=:all:'
          CIBW_TEST_COMMAND: >-
            python -I -c "from namioto import __version__, _audio; from namioto.karaoke.song_input import build_song; assert _audio.__version__ == __version__" &&
            namioto-cli --help
        run: |
          python -m pip install cibuildwheel==4.3.5
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.build }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: namioto-*-x86_64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-cp314-*
          path: release
          merge-multiple: true
      - name: Assemble release assets
        run: |
          mkdir -p release
          cp artifacts/namioto-Linux-x86_64/namioto-linux-x86_64.AppImage release/
          python scripts/package_release.py windows --app artifacts/namioto-Windows-x86_64 --output release
      - name: Publish GitHub Release
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          packages=(
            namioto-linux-x86_64.AppImage
            namioto-windows-x86_64.zip
            "namioto-${version}-cp314-cp314-manylinux_2_34_x86_64.whl"
            "namioto-${version}-cp314-cp314-win_amd64.whl"
          )
          sha256sum -- "${packages[@]}" > SHA256SUMS
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$RELEASE_TAG" "${packages[@]}" SHA256SUMS --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              printf 'Release %s is already published.\n' "$RELEASE_TAG"
            fi
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" SHA256SUMS \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
